[platformio]
src_dir = main
default_envs = wokwi

[env:wokwi]
platform = espressif32@6.10.0
platform_packages =
    platformio/framework-espidf@3.50400.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.partitions = partitions.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.wokwi"
monitor_speed = 115200
