name: Build ESP32-S3 firmware
on: [push, pull_request, workflow_dispatch]
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio==6.1.18
      - run: pio run -e wokwi
      - run: python tools/prepare_wokwi.py
      - run: python tests/run_host_tests.py --cjson-dir "$HOME/.platformio/packages/framework-espidf/components/json/cJSON"
      - uses: actions/upload-artifact@v4
        with:
          name: briqon-esp32s3-wokwi
          path: |
            build/
            diagram.json
            wokwi.toml
            dependencies.lock
